name: Fetch current SysPrac26 schedule

on:
  push:
    paths:
      - .github/workflows/scrape-schedule.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Schedule26 through reader
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 --max-time 90 \
            "https://r.jina.ai/https://www.systemspractice.org/Schedule26" \
            -o schedule26.md
          echo "Fetched $(wc -c < schedule26.md) bytes"
          sed -n '1,500p' schedule26.md

      - name: Upload fetched schedule
        uses: actions/upload-artifact@v4
        with:
          name: schedule26
          path: schedule26.md
          retention-days: 1
